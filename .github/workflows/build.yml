name: Build

# Every push/PR builds AltTab.app and uploads it as a workflow artifact.
# Pushing a tag like v1.2.0 also publishes a GitHub Release with the zipped app attached.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases on tag pushes

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev+${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        env:
          ALTTAB_UNIVERSAL: "1"
          ALTTAB_SIGN_IDENTITY: "-"   # ad-hoc; no Developer ID in CI
          ALTTAB_VERSION: ${{ steps.version.outputs.version }}
          ALTTAB_BUILD: ${{ github.run_number }}
        run: ./scripts/build-app.sh --no-install

      - name: Verify
        run: |
          lipo -archs build/AltTab.app/Contents/MacOS/AltTab
          codesign --verify --verbose build/AltTab.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/AltTab.app/Contents/Info.plist

      - name: Zip
        run: ditto -c -k --keepParent build/AltTab.app "build/AltTab-${{ steps.version.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: AltTab-${{ steps.version.outputs.version }}
          path: build/AltTab-*.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/AltTab-*.zip --title "AltTab $GITHUB_REF_NAME" --generate-notes
