name: Build

# Every push to main and every pull request builds AltTab-<version>.dmg (and a zip of the app) and
# uploads them as a workflow artifact. Releases are built by release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build app and DMG
        id: package
        env:
          ALTTAB_UNIVERSAL: "1"
          ALTTAB_SIGN_IDENTITY: "-"   # ad-hoc; no Developer ID in CI
          ALTTAB_BUILD: ${{ github.run_number }}
        run: ./scripts/make-dmg.sh

      - name: Verify
        run: |
          lipo -archs build/AltTab.app/Contents/MacOS/AltTab
          codesign --verify --verbose build/AltTab.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/AltTab.app/Contents/Info.plist

      - uses: actions/upload-artifact@v4
        with:
          name: AltTab-${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.zip }}
